<div class="action-container">
  <button mat-raised-button color="primary" [routerLink]="['/create-product']">Criar Produto</button>
</div>

@for (product of products(); track product.id) {
@defer (on immediate) {
<app-card [product]="product" (edit)="onEdit(product)" (delete)="onDelete(product)">
</app-card><br>
}

}
@empty {
@defer (on immediate) {
<app-no-items />
}
}
